<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>📦 电器位置查询 V2.3｜商品列表与扫描优化</title>
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:#fff;padding:18px 16px 12px;position:sticky;top:0;z-index:10;border-bottom:1px solid #e5e5e5}
h1{font-size:22px;margin:0 0 4px}
.sub{font-size:13px;color:#777}
.container{max-width:760px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:12px;padding:14px 10px;font-size:16px;font-weight:600;background:#f0f1f3;color:#222;min-height:48px}
button.primary{background:#111;color:#fff}
button.danger{background:#fff0f0;color:#c62828}
button.small{min-height:40px;padding:9px 12px;font-size:14px}
input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px;background:#fff}
label{display:block;font-size:14px;color:#555;margin:13px 0 6px}
.back{margin-bottom:10px}
.item{border:1px solid #eee;border-radius:13px;padding:14px;margin:9px 0}
.item-title{font-size:17px;font-weight:700}
.meta{font-size:14px;color:#555;line-height:1.65;margin-top:6px}
.location{font-weight:700}
.empty{text-align:center;color:#888;padding:25px 10px}
.result-card{text-align:center;padding:20px 15px}
.result-icon{font-size:46px}
.result-found{font-size:14px;color:#777}
.result-name{font-size:26px;font-weight:800;margin:5px 0 15px}
.location-box{background:#f1f3f5;border-radius:15px;padding:18px 12px;margin:14px 0}
.location-label{font-size:13px;color:#777}
.location-big{font-size:22px;font-weight:800;line-height:1.4}
.result-buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.result-buttons button{width:100%}
.scan-tip{background:#f7f7f7;border-radius:11px;padding:12px;font-size:14px;line-height:1.55;margin-bottom:11px}
.status{font-size:14px;color:#666;margin-top:9px;min-height:20px}
#videoWrap{width:100%;overflow:hidden;border-radius:13px;background:#000;position:relative}
#previewVideo{width:100%;display:block}
.scan-overlay{position:absolute;inset:0;pointer-events:none;z-index:2}
.scan-cutout{position:absolute;left:5%;right:5%;top:38%;bottom:38%;border:2px solid #42a5f5;border-radius:8px}
.scan-overlay::before{content:"";position:absolute;left:0;right:0;top:0;height:38%;background:rgba(0,0,0,0.55)}
.scan-overlay::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;background:rgba(0,0,0,0.55)}
.scan-overlay .left{position:absolute;left:0;top:38%;width:5%;bottom:38%;background:rgba(0,0,0,0.55)}
.scan-overlay .right{position:absolute;right:0;top:38%;width:5%;bottom:38%;background:rgba(0,0,0,0.55)}
.location-list{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat{display:flex;justify-content:space-between;background:#f7f7f7;padding:12px;border-radius:11px;margin-bottom:12px}
.stat strong{font-size:18px}
.stock-tag{display:inline-block;margin:2px 0;}
.update-time{font-size:12px;color:#888;margin-top:4px;}
.cat-item{border:1px solid #ddd;padding:12px;border-radius:10px;margin:8px 0;}
.cat-sub{margin-left:14px;margin-top:6px;color:#444}

.home-map-wrap{width:100%;margin:0 0 14px;overflow:hidden;border-radius:16px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.home-map{display:block;width:100%;height:auto;max-width:100%;object-fit:contain}

@media (max-width:400px){
  .item-title{font-size:16px}
  .meta{font-size:13px}
  .grid button{font-size:15px;padding:12px 6px}
}
.scan-compact{padding:10px}.scan-compact .back{margin-bottom:6px}.scan-compact .status{margin-top:6px}</style>
</head>
<body>
<header><h1>📦 电器位置查询</h1><div class="sub">V2.3｜商品列表与扫描优化</div></header>
<div class="container">
<div class="home-map-wrap"><img src="map.png" alt="电器位置查询" class="home-map"></div>
 <div id="home" class="card">
 <div class="grid">
<button class="primary" onclick="startScanner()">📷 扫描商品</button>
<button onclick="manualBarcode()">⌨️ 输入条码</button>
<button type="button" onclick="openNewProduct()">➕ 新增商品</button>
<button onclick="showSearch()">🔍 搜索商品</button>
<button onclick="showAll()">📋 全部商品</button>
<button onclick="manageCategory()">🏷 商品种类</button>
<button onclick="manageLocations()">📍 位置管理</button>
<button onclick="exportAllData()">📤 导出全部数据</button>
<button onclick="importAllData()">📥 导入数据</button>
<button class="danger" onclick="clearAllData()">🗑 清除所有资料</button>
</div>
</div>
<div id="content"></div>
</div>
<script>
const IK="myElectricalLocation_v22";
const LK="myElectricalLocations_v22";
const CK="myElectricalCategory_v22";
let items=JSON.parse(localStorage.getItem(IK)||"[]");
let locations=JSON.parse(localStorage.getItem(LK)||"[]");
let categories=JSON.parse(localStorage.getItem(CK)||"[]");
let mediaStream=null;
let codeReader=null;
let scanning=false;

function esc(v){
    return String(v??"").replace(/[&<>"']/g,function(m){
        if(m==="&")return "&amp;";
        if(m==="<")return "&lt;";
        if(m===">")return "&gt;";
        if(m==='"')return "&quot;";
        if(m==="'")return "&#39;";
        return m;
    });
}
function save(){
    localStorage.setItem(IK,JSON.stringify(items));
    localStorage.setItem(LK,JSON.stringify(locations));
    localStorage.setItem(CK,JSON.stringify(categories));
}
function content(h){document.getElementById("content").innerHTML=h;scrollTo(0,0)}
function back(){stopScanner();content("")}

function exportAllData(){
    try{
        const backup={
            app:"电器位置查询",
            version:"1.0",
            exportDate:new Date().toISOString(),
            items:items,
            locations:locations,
            categories:categories
        };
        const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json;charset=utf-8"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        const d=new Date();
        const pad=n=>String(n).padStart(2,"0");
        const fileName="电器位置查询_数据备份_"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+".json";
        a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
        alert("数据导出成功！\n\n商品："+items.length+" 条\n位置："+locations.length+" 条\n分类："+categories.length+" 个大类\n\n文件："+fileName);
    }catch(e){console.error(e);alert("导出失败，请重试。\n"+e.message);}
}

function importAllData(){
    const input=document.createElement("input");
    input.type="file";
    input.accept=".json,application/json";
    input.onchange=()=>{
        const file=input.files&&input.files[0];
        if(!file)return;
        const reader=new FileReader();
        reader.onload=()=>{
            try{
                const data=JSON.parse(reader.result);
                if(!data||typeof data!=="object"||!Array.isArray(data.items)||!Array.isArray(data.locations)||!Array.isArray(data.categories)){
                    throw new Error("这不是有效的“电器位置查询”数据备份文件。");
                }
                const summary="准备导入：\n商品 " + data.items.length + " 条\n位置 " + data.locations.length + " 条\n分类 " + data.categories.length + " 个大类";
                if(!confirm(summary+"\n\n导入后将替换当前设备中的全部资料。\n是否继续？"))return;
                items=data.items;locations=data.locations;categories=data.categories;
                save();
                alert("导入成功！\n\n商品："+items.length+" 条\n位置："+locations.length+" 条\n分类："+categories.length+" 个大类");
                back();
            }catch(e){
                console.error(e);
                alert("导入失败：\n"+(e.message||"文件格式不正确。")+"\n\n当前资料没有被修改。");
            }
        };
        reader.onerror=()=>alert("读取文件失败，请重新选择文件。");
        reader.readAsText(file,"utf-8");
    };
    input.click();
}

function loc(x){return x.area&&x.shelf?x.area+" → "+x.shelf:(x.area||x.shelf||x.location||"未设置")}
function byCode(c){c=String(c||"").trim();return items.find(x=>String(x.code||"").trim()===c)}
function openNewProduct(){try{form(null,"")}catch(e){console.error(e);alert("打开新增商品页面失败，请刷新页面后再试。")}}

function manageCategory(){
    stopScanner();
    let html='<div class="card"><button class="small back" onclick="back()">← 返回</button><h2>🏷商品种类管理</h2><label>新增大类</label><input id="catMainName" placeholder="例如：小家电"><button class="primary" style="width:100%;margin-top:10px" onclick="addMainCat()">➕ 添加大类</button><div style="margin-top:16px"><h4>已有分类（大类‑小类）</h4><div id="catList"></div></div></div>';
    content(html);
    renderCategoryList();
}
function addMainCat(){
    let name=document.getElementById("catMainName").value.trim();
    if(!name){alert("请输入大类名称");return;}
    categories.push({id:Date.now().toString(),name:name,subs:[]});
    save();
    document.getElementById("catMainName").value="";
    renderCategoryList();
}
function addSubCat(mainId){
    let subName=prompt("输入小类名称：");
    if(!subName||!subName.trim())return;
    let main=categories.find(i=>i.id===mainId);
    if(!main)return;
    main.subs.push({id:Date.now().toString(),name:subName.trim()});
    save();
    renderCategoryList();
}
function delMainCat(mainId){
    if(!confirm("确定删除该大类，下属所有小类一并删除？"))return;
    categories=categories.filter(i=>i.id!==mainId);
    save();renderCategoryList();
}
function editSubCat(mainId,subId){
 let main=categories.find(i=>i.id===mainId); if(!main)return;
 let sub=main.subs.find(x=>x.id===subId); if(!sub)return;
 let n=prompt("修改小类名称：",sub.name); if(n===null)return; n=n.trim();
 if(!n){alert("小类名称不能为空");return;}
 if(main.subs.some(x=>x.id!==subId&&x.name===n)){alert("该大类下已经存在同名小类");return;}
 sub.name=n; save(); renderCategoryList();
}
function delSubCat(mainId,subId){
 if(!confirm("确定删除此小类？"))return;
 let main=categories.find(i=>i.id===mainId); if(!main)return;
 main.subs=main.subs.filter(s=>s.id!==subId); save(); renderCategoryList();
}
function renderCategoryList(){
 let wrap=document.getElementById("catList"); if(!wrap)return;
 if(!categories.length){wrap.innerHTML="<div class='empty'>暂无分类，请先添加大类</div>";return;}
 let out="";
 for(let m of categories){
  out+='<div class="cat-item"><div><b>📦 '+esc(m.name)+'</b><button class="small" onclick="addSubCat(\''+esc(m.id)+'\')">+增加小类</button><button class="small danger" onclick="delMainCat(\''+esc(m.id)+'\')">删除大类</button></div>';
  let subs=[...(m.subs||[])].sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"zh-CN"));
  for(let x of subs) out+='<div class="cat-sub">- '+esc(x.name)+'<button class="small" onclick="editSubCat(\''+esc(m.id)+'\',\''+esc(x.id)+'\')">修改</button><button class="small danger" onclick="delSubCat(\''+esc(m.id)+'\',\''+esc(x.id)+'\')">删除</button></div>';
  out+='</div>';
 }
 wrap.innerHTML=out;
}
function form(x,code){
 stopScanner();
 let e=!!x;
 // 兼容新旧数据格式：优先使用 area/shelf；旧数据使用 location（区域 → 货架）
 let a=String(x?.area||"").trim();
 let s=String(x?.shelf||"").trim();
 if(x?.location){
     let parts=String(x.location).split(" → ");
     if(!a)a=String(parts[0]||"").trim();
     if(!s)s=String(parts.slice(1).join(" → ")||"").trim();
 }
 let selMainId=x?.mainCatId||"";
 let selSubId=x?.subCatId||"";

 let formHtml='<div class="card"><button class="small back" onclick="'+(e?'showItem(\''+esc(x.id)+'\')':'back()')+'">← 返回</button><h2>'+(e?"编辑商品":"新增商品")+'</h2><label>条码 / QR Code</label><input id="code" value="'+esc(x?.code||code)+'" placeholder="可扫码或手动输入"><label>商品名称 *</label><input id="name" value="'+esc(x?.name||"")+'" placeholder="例如 Dyson V15"><label>品牌</label><input id="brand" value="'+esc(x?.brand||"")+'" placeholder="例如 Dyson"><label>型号</label><input id="model" value="'+esc(x?.model||"")+'" placeholder="例如 V15"><label>颜色</label><input id="color" value="'+esc(x?.color||"")+'" placeholder="例如 Gold / Black / White"><label>库存状态</label><select id="stock"><option value="yes" '+(x?.stock!=="no"?"selected":"")+'>✅ 有库存</option><option value="no" '+(x?.stock==="no"?"selected":"")+'>❌ 无库存</option></select><label>库存数量</label><input id="stockQty" value="'+esc(x?.stockQty??"")+'" placeholder="填写数字，例如 5，可不填"><label>商品大类</label><select id="mainCatSel" onchange="refreshSubSelect()"><option value="">不选择大类</option>';
 categories.forEach(m=>{formHtml+='<option value="'+esc(m.id)+'" '+(m.id===selMainId?"selected":"")+'>'+esc(m.name)+'</option>';});
 formHtml+='</select><label>商品小类</label><select id="subCatSel"><option value="">先选择大类</option></select><label>区域</label><select id="area" onchange="updateShelfOptions()"><option value="">请选择区域</option>';
 [...new Set(locations.map(x=>x.area).filter(Boolean))].forEach(v=>{formHtml+='<option value="'+esc(v)+'" '+(v===a?"selected":"")+'>'+esc(v)+'</option>';});
 formHtml+='</select><label>货架 / 存放位置</label><select id="shelf"></select><button class="primary" style="width:100%;margin-top:16px" onclick="saveItem(\''+(e?esc(x.id):"")+'\')">💾 保存</button>';
 if(e) formHtml+='<button class="danger" style="width:100%;margin-top:9px" onclick="del(\''+esc(x.id)+'\')">🗑 删除商品</button>';
 formHtml+='</div>';
 content(formHtml);
 let shelfEl=document.getElementById("shelf");
 if(shelfEl)shelfEl.dataset.current=s;
 updateShelfOptions();
 setTimeout(()=>{
    document.getElementById("mainCatSel").value=selMainId;
    refreshSubSelect(selSubId);
 },20);
}

// =========修复点：小类下拉按照中文名称拼音排序========
function refreshSubSelect(presetSubId){
    let mainSel=document.getElementById("mainCatSel");
    let subSel=document.getElementById("subCatSel");
    if(!mainSel||!subSel)return;
    let mainId=mainSel.value;
    if(!mainId){
        subSel.innerHTML='<option value="">先选择大类</option>';
        return;
    }
    let mainObj=categories.find(m=>m.id===mainId);
    if(!mainObj||!mainObj.subs.length){
        subSel.innerHTML='<option value="">该大类暂无小类</option>';
        return;
    }
    let html='<option value="">--请选择小类--</option>';
    //复制数组，localeCompare 中文zh‑CN按拼音升序排序
    const sortedSubs = [...mainObj.subs].sort((a,b)=> a.name.localeCompare(b.name,"zh-CN"));
    sortedSubs.forEach(s=>{
        html+='<option value="'+esc(s.id)+'" '+(s.id===presetSubId?"selected":"")+'>'+esc(s.name)+'</option>';
    });
    subSel.innerHTML=html;
}

function updateShelfOptions(){
 let areaEl=document.getElementById("area"),shelfEl=document.getElementById("shelf");
 if(!areaEl||!shelfEl)return;
 let area=areaEl.value,current=shelfEl.dataset.current||"";
 let shelves=[...new Set(locations.filter(q=>q.area===area&&q.shelf).map(q=>q.shelf))].sort((a,b)=>a.localeCompare(b,"zh-CN"));
 let shelfHtml='<option value="">请选择货架 / 存放位置</option>';
 shelves.forEach(v=>{shelfHtml+='<option value="'+esc(v)+'" '+(v===current?"selected":"")+'>'+esc(v)+'</option>';});
 shelfEl.innerHTML=shelfHtml;
 if(current&&shelves.includes(current))shelfEl.value=current;else shelfEl.value="";
 shelfEl.dataset.current=shelfEl.value;
}
function saveItem(id){
 let code=document.getElementById("code").value.trim(),name=document.getElementById("name").value.trim();
 if(!name){alert("请输入商品名称");return}
 let d=code&&items.find(x=>x.code===code&&x.id!==id);
 if(d){alert("这个条码已经存在："+d.name);showItem(d.id);return}

 let mainCatId=document.getElementById("mainCatSel").value;
 let subCatId=document.getElementById("subCatSel").value;

 let x={
    id:id||Date.now().toString(),
    code,
    name,
    brand:document.getElementById("brand").value.trim(),
    model:document.getElementById("model").value.trim(),
    color:document.getElementById("color").value.trim(),
    stock:document.getElementById("stock").value,
    stockQty:document.getElementById("stockQty").value.trim(),
    mainCatId:mainCatId||"",
    subCatId:subCatId||"",
    area:document.getElementById("area").value.trim(),
    shelf:document.getElementById("shelf").value.trim(),
    updated:new Date().toLocaleString()
 };
 if(id){
    let i=items.findIndex(q=>q.id===id);
    if(i>=0) items[i]=x;
 }else{
    items.push(x);
 }
 save();
 showItem(x.id);
}
function del(id){
    let x=items.find(q=>q.id===id);
    if(x&&confirm("确定删除「"+x.name+"」吗？")){
        items=items.filter(q=>q.id!==id);
        save();
        showAll();
    }
}
function openEditById(itemId){
  const item = items.find(q=>q.id===itemId);
  if(item){form(item);}
}
function getCatText(item){
    if(!item.mainCatId) return "未分类";
    let m=categories.find(c=>c.id===item.mainCatId);
    if(!m) return "未分类";
    if(!item.subCatId) return esc(m.name);
    let s=m.subs.find(su=>su.id===item.subCatId);
    if(!s) return esc(m.name);
    return esc(m.name)+" / "+esc(s.name);
}

function showItem(id){
 stopScanner();
 let x=items.find(q=>q.id===id);
 if(!x)return showAll();
 const qtyText = x.stockQty ? esc(x.stockQty) : "未填写";
 const catTxt=getCatText(x);
 let itemHtml='<div class="card result-card"><button class="small back" onclick="showAll()">← 返回</button><div class="result-icon">📍</div><div class="result-found">找到商品</div><div class="result-name">'+esc(x.name)+'</div><div class="location-box"><div class="location-label">存放位置</div><div class="location-big">📍 '+esc(loc(x))+'</div></div><div style="margin:10px 0">库存状态：<b>'+(x.stock==="no"?"❌ 无库存":"✅ 有库存")+'</b></div><div style="margin:6px 0">库存数量：<b>'+qtyText+'</b></div><div style="margin:6px 0">商品种类：<b>'+catTxt+'</b></div>';
 if(x.color) itemHtml+='<div>🎨 颜色：<b>'+esc(x.color)+'</b></div>';
 itemHtml+='<div class="meta">';
 if(x.brand)itemHtml+='<div><b>品牌：</b>'+esc(x.brand)+'</div>';
 if(x.model)itemHtml+='<div><b>型号：</b>'+esc(x.model)+'</div>';
 if(x.code)itemHtml+='<div><b>条码：</b>'+esc(x.code)+'</div>';
 itemHtml+='<div class="update-time">🕒 最后修改：'+esc(x.updated||"无记录")+'</div></div><div class="result-buttons"><button class="primary" type="button" onclick="openEditById(\''+esc(x.id)+'\')">✏️ 编辑</button><button type="button" onclick="showSearch()">🔍 搜索</button></div><button style="width:100%;margin-top:9px" onclick="startScanner()">📷 继续扫描</button></div>';
 content(itemHtml);
}
function scanResult(x){showItem(x.id)}
function registerNewProduct(code){
 stopScanner();
 try{form(null,code||"")}catch(e){console.error(e);alert("打开商品登记页面失败，请刷新页面后再试。")}
}
function newResult(code){
 let newHtml='<div class="card result-card"><div class="result-icon">🆕</div><div class="result-found">新商品</div><div class="result-name" style="font-size:22px">尚未登记</div><div class="location-box"><div class="location-label">扫描到的条码</div><div style="font-size:18px;font-weight:700;word-break:break-all">'+esc(code)+'</div></div><button type="button" class="primary" style="width:100%" onclick="registerNewProduct(\''+esc(code)+'\')">➕ 登记这个商品</button><button style="width:100%;margin-top:9px" onclick="startScanner()">📷 重新扫描</button><button style="width:100%;margin-top:9px" onclick="back()">🏠 返回首页</button></div>';
 content(newHtml);
}
function handleScannedCode(code){
 stopScanner();
 code=String(code||"").trim();
 if(!code) return;
 const existing=byCode(code);
 existing ? scanResult(existing) : newResult(code);
}

async function startScanner(){
  stopScanner();
  let scanHtml='<div class="card scan-compact"><button class="small back" onclick="back()">← 取消扫描</button><div id="videoWrap"><video id="previewVideo" playsinline muted autoplay></video><div class="scan-overlay"><div class="left"></div><div class="right"></div><div class="scan-cutout"></div></div></div><div id="scanStatus" class="status">正在启动后置摄像头…</div></div>';
  content(scanHtml);
  const st=document.getElementById("scanStatus"),videoEl=document.getElementById("previewVideo");
  if(!videoEl)return;
  try{

 if(!name){alert("请输入区域名称");return;}

function editLocation(id){

 let areas=[...new Set(locations.map(x=>x.area).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));

   let subs=locations.filter(x=>x.area===area&&x.shelf).sort((a,b)=>String(a.shelf).localeCompare(String(b.shelf),"zh-CN"));
   if(!subs.length) out+='<div class="cat-sub">- 暂无下级位置</div>';

   out+='</div>';
 }
 e.innerHTML=out;
}
