<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:#fff;padding:18px 16px 12px;position:sticky;top:0;z-index:10;border-bottom:1px solid #e5e5e5}
h1{font-size:22px;margin:0 0 4px}
.sub{font-size:13px;color:#777}
.container{max-width:760px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:12px;padding:14px 10px;font-size:16px;font-weight:600;background:#f0f1f3;color:#222;min-height:48px}
button.primary{background:#111;color:#fff}
button.danger{background:#fff0f0;color:#c62828}
button.small{min-height:40px;padding:9px 12px;font-size:14px}
input,select,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px;background:#fff}
label{display:block;font-size:14px;color:#555;margin:13px 0 6px}

.item-title{font-size:17px;font-weight:700}
.meta{font-size:14px;color:#555;line-height:1.65;margin-top:6px}

.result-card{text-align:center;padding:20px 15px}
.result-icon{font-size:46px}
.result-found{font-size:14px;color:#777}
.result-name{font-size:26px;font-weight:800;margin:5px 0 15px}
.location-box{background:#f1f3f5;border-radius:15px;padding:18px 12px;margin:14px 0}
.location-label{font-size:13px;color:#777}
.location-big{font-size:22px;font-weight:800;line-height:1.4}

#videoWrap{width:100%;overflow:hidden;border-radius:13px;background:#000;position:relative}
#previewVideo{width:100%;display:block}
.scan-overlay{position:absolute;inset:0;pointer-events:none;z-index:2}
.scan-cutout{position:absolute;left:5%;right:5%;top:38%;bottom:38%;border:2px solid #42a5f5;border-radius:8px}
.scan-overlay::before{content:"";position:absolute;left:0;right:0;top:0;height:38%;background:rgba(0,0,0,0.55)}
.scan-overlay::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;background:rgba(0,0,0,0.55)}
.scan-overlay .left{position:absolute;left:0;top:38%;width:5%;bottom:38%;background:rgba(0,0,0,0.55)}

.location-list{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat{display:flex;justify-content:space-between;background:#f7f7f7;padding:12px;border-radius:11px;margin-bottom:12px}

.home-map-wrap{width:100%;margin:0 0 14px;overflow:hidden;border-radius:16px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.home-map{display:block;width:100%;height:auto;max-width:100%;object-fit:contain}

@media (max-width:400px){
  .item-title{font-size:16px}
  .meta{font-size:13px}
  .grid button{font-size:15px;padding:12px 6px}
}
.scan-compact{padding:10px}.scan-compact .back{margin-bottom:6px}.scan-compact .status{margin-top:6px}
.display-row{border:1px solid #e5e5e5;border-radius:12px;padding:12px;margin:9px 0;background:#fff}.display-top{display:flex;align-items:center;gap:10px}.display-index{background:#f1f2f4;border-radius:8px;padding:8px 10px;font-weight:700}.display-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.display-actions button{font-size:14px;padding:9px;min-height:42px}.display-row[draggable="true"]{cursor:grab}.display-row.dragging{opacity:.4}.display-progress{height:7px;background:#eee;border-radius:8px;overflow:hidden;margin:10px 0}.display-progress>div{height:100%;background:#333}.display-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.display-toolbar button{flex:1;min-width:120px}
 .accessory-mark{display:inline-block;background:#e8f1ff;color:#164d91;border-radius:6px;padding:2px 7px;font-size:13px;font-weight:700;margin-left:3px}.accessory-edit{margin-top:8px;min-height:34px;padding:6px 10px;font-size:12px}
</style>
</head>
<body>
<header><h1>电器管理</h1><div class="sub">V3.2｜商品 PDF 与展柜管理</div></header>
<div class="container">
<div class="home-map-wrap"><img src="map.png" alt="电器管理" class="home-map"></div>
 <div id="home" class="card">
 <div class="grid">
<button class="primary" onclick="startScanner()">📷 扫描商品</button>
<button onclick="manualBarcode()">⌨️ 输入条码</button>
<button type="button" onclick="openNewProduct()">➕ 新增商品</button>
<button onclick="showSearch()">🔍 搜索商品</button>
<button onclick="openReceiving()">📥 收货</button>
<button onclick="showReceipts()">🧾 导出收货收据</button>
<button onclick="showAll()">📋 全部商品</button>
<button onclick="showProductPDFOptions()">📄 导出商品PDF</button>
<button onclick="openDisplayCheck()">🛒 检查展柜</button>
<button onclick="manageCategory()">🏷 商品种类</button>
<button onclick="manageLocations()">📍 位置管理</button>
<button onclick="exportAllData()">📤 导出全部数据</button>
<button onclick="importAllData()">📥 导入数据</button>
<button class="danger" onclick="openClearReceipts()">🗑 清除收货数据</button>
<button class="danger" onclick="clearAllData()">🗑 清除所有资料</button>
</div>
</div>
<div id="content"></div>
</div>
<script>
const IK="myElectricalLocation_v22";
const LK="myElectricalLocations_v22";
const CK="myElectricalCategory_v22";
const RK="myElectricalReceipts_v24";
const DK="myElectricalDisplayChecks_v30";
let items=JSON.parse(localStorage.getItem(IK)||"[]");
let locations=JSON.parse(localStorage.getItem(LK)||"[]");
let categories=JSON.parse(localStorage.getItem(CK)||"[]");
let receipts=JSON.parse(localStorage.getItem(RK)||"[]");
let displayData=JSON.parse(localStorage.getItem(DK)||"{\"sessions\":[],\"activeId\":null}");
if(!Array.isArray(displayData.sessions))displayData={sessions:[],activeId:null};
// 旧版本通过收货自动创建的商品使用与收货记录相同的 id。
// 这些仅因收货产生的商品不应出现在商品主档或商品搜索中。
function isReceiptOnlyItem(x){return receipts.some(r=>String(r.id)===String(x.id))}
function catalogItems(){return items.filter(x=>!isReceiptOnlyItem(x))}
let mediaStream=null;
let codeReader=null;
let scanning=false;

function esc(v){
    return String(v??"").replace(/[&<>"']/g,function(m){
        if(m==="&")return "&amp;";
        if(m==="<")return "&lt;";
        if(m===">")return "&gt;";
        if(m==='"')return "&quot;";
        if(m==="'")return "&#39;";
        return m;
    });
}
function save(){
    localStorage.setItem(IK,JSON.stringify(items));
    localStorage.setItem(LK,JSON.stringify(locations));
    localStorage.setItem(CK,JSON.stringify(categories));
    localStorage.setItem(RK,JSON.stringify(receipts));
    localStorage.setItem(DK,JSON.stringify(displayData));
}
function content(h){
  const el=document.getElementById("content");
  el.innerHTML=h;
  requestAnimationFrame(()=>{
    const header=document.querySelector("header");
    const offset=(header?header.offsetHeight:0)+8;
    window.scrollTo({top:Math.max(0,el.offsetTop-offset),behavior:"smooth"});
  });
}
function back(){stopScanner();content("")}

function clearAllData(){
    const pwd=prompt("请输入清除所有资料的密码：");
    if(pwd===null)return;
    if(pwd!=="888"){
        alert("密码错误，资料未清除。");
        return;
    }
    if(!confirm("确定要清除全部资料吗？\n\n这将删除所有商品、位置和商品分类，且无法恢复。"))return;
    items=[];
    locations=[];
    categories=[];
    receipts=[];
    displayData={sessions:[],activeId:null};
    localStorage.removeItem(DK);
    localStorage.removeItem(RK);
    localStorage.removeItem(IK);
    localStorage.removeItem(LK);
    localStorage.removeItem(CK);
    alert("全部资料已清除。");
    back();
}

function exportAllData(){
    try{
        const backup={
            app:"电器管理",
            version:"3.8",
            backupType:"full-system",
            exportDate:new Date().toISOString(),
            items:items,
            locations:locations,
            categories:categories,
            receipts:receipts,
            displayData:displayData,
            // 原始本地存储快照：完整保留系统当前所有业务数据，避免过滤导致记录遗漏。
            storageSnapshot:{
                [IK]:localStorage.getItem(IK),
                [LK]:localStorage.getItem(LK),
                [CK]:localStorage.getItem(CK),
                [RK]:localStorage.getItem(RK),
                [DK]:localStorage.getItem(DK)
            }
        };
        const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json;charset=utf-8"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        const d=new Date();
        const pad=n=>String(n).padStart(2,"0");
        const fileName="电器管理_数据备份_"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+".json";
        a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
        alert("数据导出成功！\n\n商品主档："+catalogItems().length+" 条\n原始商品记录："+items.length+" 条\n位置："+locations.length+" 条\n分类："+categories.length+" 个大类\n收货记录："+receipts.length+" 条\n展柜盘点："+displayData.sessions.length+" 次\n展柜排序（displayOrder）及配件标识：已包含\n完整本地数据快照：已包含\n\n文件："+fileName);
    }catch(e){console.error(e);alert("导出失败，请重试。\n"+e.message);}
}

function importAllData(){
    const input=document.createElement("input");
    input.type="file";
    input.accept=".json,application/json";
    input.onchange=()=>{
        const file=input.files&&input.files[0];
        if(!file)return;
        const reader=new FileReader();
        reader.onload=()=>{
            try{
                const data=JSON.parse(reader.result);
                if(!data||typeof data!=="object"||!Array.isArray(data.items)||!Array.isArray(data.locations)||!Array.isArray(data.categories)){
                    throw new Error("这不是有效的“电器管理”数据备份文件。");
                }
                if(data.displayData!==undefined&&(!data.displayData||typeof data.displayData!=="object"||!Array.isArray(data.displayData.sessions)))throw new Error("备份文件中的展柜盘点格式不正确。");
                if(data.receipts!==undefined&&!Array.isArray(data.receipts))throw new Error("备份文件中的收货记录格式不正确。");
                const incomingReceipts=Array.isArray(data.receipts)?data.receipts:[];
                const incomingDisplay=data.displayData&&Array.isArray(data.displayData.sessions)?data.displayData:{sessions:[],activeId:null};
                const summary="准备导入：\n商品 " + data.items.length + " 条\n位置 " + data.locations.length + " 条\n分类 " + data.categories.length + " 个大类\n收货记录 " + incomingReceipts.length + " 条\n展柜盘点 " + incomingDisplay.sessions.length + " 次"+(data.receipts===undefined?"\n⚠️ 旧版备份不含收货记录，导入后当前收货记录将被清空。":"");
                if(!confirm(summary+"\n\n导入后将替换当前设备中的全部资料。\n是否继续？"))return;
                items=data.items;locations=data.locations;categories=data.categories;receipts=incomingReceipts;displayData=incomingDisplay;
                save();
                alert("导入成功！\n\n商品："+catalogItems().length+" 条\n位置："+locations.length+" 条\n分类："+categories.length+" 个大类\n收货记录："+receipts.length+" 条\n展柜盘点："+displayData.sessions.length+" 次");
                back();
            }catch(e){
                console.error(e);
                alert("导入失败：\n"+(e.message||"文件格式不正确。")+"\n\n当前资料没有被修改。");
            }
        };
        reader.onerror=()=>alert("读取文件失败，请重新选择文件。");
        reader.readAsText(file,"utf-8");
    };
    input.click();
}

function loc(x){return x.area&&x.shelf?x.area+" → "+x.shelf:(x.area||x.shelf||x.location||"未设置")}
function byCode(c){c=String(c||"").trim();return items.find(x=>String(x.code||"").trim()===c)}
function openNewProduct(){try{form(null,"")}catch(e){console.error(e);alert("打开新增商品页面失败，请刷新页面后再试。")}}

function manageCategory(){
    stopScanner();
    let html='<div class="card"><button class="small back" onclick="back()">← 返回</button><h2>🏷商品种类管理</h2><label>新增大类</label><input id="catMainName" placeholder="例如：小家电"><button class="primary" style="width:100%;margin-top:10px" onclick="addMainCat()">➕ 添加大类</button><div style="margin-top:16px"><h4>已有分类（大类‑小类）</h4><div id="catList"></div></div></div>';
    content(html);
    renderCategoryList();
}
function addMainCat(){
    let name=document.getElementById("catMainName").value.trim();
    if(!name){alert("请输入大类名称");return;}
    categories.push({id:Date.now().toString(),name:name,subs:[]});
    save();
    document.getElementById("catMainName").value="";
    renderCategoryList();
}
function addSubCat(mainId){
    let subName=prompt("输入小类名称：");
    if(!subName||!subName.trim())return;
    let main=categories.find(i=>i.id===mainId);
    if(!main)return;
    main.subs.push({id:Date.now().toString(),name:subName.trim()});
    save();
    renderCategoryList();
}
function delMainCat(mainId){
    if(!confirm("确定删除该大类，下属所有小类一并删除？"))return;
    categories=categories.filter(i=>i.id!==mainId);
    save();renderCategoryList();
}
function editSubCat(mainId,subId){
 let main=categories.find(i=>i.id===mainId); if(!main)return;
 let sub=main.subs.find(x=>x.id===subId); if(!sub)return;
 let n=prompt("修改小类名称：",sub.name); if(n===null)return; n=n.trim();
 if(!n){alert("小类名称不能为空");return;}
 if(main.subs.some(x=>x.id!==subId&&x.name===n)){alert("该大类下已经存在同名小类");return;}
 sub.name=n; save(); renderCategoryList();
}
function delSubCat(mainId,subId){
 if(!confirm("确定删除此小类？"))return;
 let main=categories.find(i=>i.id===mainId); if(!main)return;
 main.subs=main.subs.filter(s=>s.id!==subId); save(); renderCategoryList();
}
function renderCategoryList(){
 let wrap=document.getElementById("catList"); if(!wrap)return;
 if(!categories.length){wrap.innerHTML="<div class='empty'>暂无分类，请先添加大类</div>";return;}
 let out="";
 for(let m of categories){
  out+='<div class="cat-item"><div><b>📦 '+esc(m.name)+'</b><button class="small" onclick="addSubCat(\''+esc(m.id)+'\')">+增加小类</button><button class="small danger" onclick="delMainCat(\''+esc(m.id)+'\')">删除大类</button></div>';
  let subs=[...(m.subs||[])].sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"zh-CN"));
  for(let x of subs) out+='<div class="cat-sub">- '+esc(x.name)+'<button class="small" onclick="editSubCat(\''+esc(m.id)+'\',\''+esc(x.id)+'\')">修改</button><button class="small danger" onclick="delSubCat(\''+esc(m.id)+'\',\''+esc(x.id)+'\')">删除</button></div>';
  out+='</div>';
 }
 wrap.innerHTML=out;
}
function form(x,code){
 stopScanner();
 let e=!!x;
 // 兼容新旧数据格式：优先使用 area/shelf；旧数据使用 location（区域 → 货架）
 let a=String(x?.area||"").trim();
 let s=String(x?.shelf||"").trim();
 if(x?.location){
     let parts=String(x.location).split(" → ");
     if(!a)a=String(parts[0]||"").trim();
     if(!s)s=String(parts.slice(1).join(" → ")||"").trim();
 }
 let selMainId=x?.mainCatId||"";
 let selSubId=x?.subCatId||"";

 let formHtml='<div class="card"><button class="small back" onclick="'+(e&&displaySortEditingId?'returnToDisplaySort()':(e?'showItem(\''+esc(x.id)+'\')':'back()'))+'">← 返回</button><h2>'+(e?"编辑商品":"新增商品")+'</h2><label>条码 / QR Code</label><input id="code" value="'+esc(x?.code||code)+'" placeholder="可扫码或手动输入"><label>SKU码</label><input id="sku" value="'+esc(x?.sku||"")+'" placeholder="请输入 SKU 码"><label>商品名称 *</label><input id="name" value="'+esc(x?.name||"")+'" placeholder="例如 Dyson V15"><label>品牌</label><input id="brand" value="'+esc(x?.brand||"")+'" placeholder="例如 Dyson"><label>型号</label><input id="model" value="'+esc(x?.model||"")+'" placeholder="例如 V15"><label>颜色</label><input id="color" value="'+esc(x?.color||"")+'" placeholder="例如 Gold / Black / White"><label>库存状态</label><select id="stock"><option value="yes" '+(x?.stock!=="no"?"selected":"")+'>✅ 有库存</option><option value="no" '+(x?.stock==="no"?"selected":"")+'>❌ 无库存</option></select><label>库存数量</label><input id="stockQty" value="'+esc(x?.stockQty??"")+'" placeholder="填写数字，例如 5，可不填"><label style="display:flex;align-items:center;gap:10px;margin-top:16px"><input type="checkbox" id="isDisplay" style="width:20px;height:20px" "+(x?.isDisplay?"checked":"")+"> 是否展示（加入展柜检查清单）</label><label>展柜排序</label><input id="displayOrder" type="number" min="1" step="1" inputmode="numeric" value="'+esc(x?.displayOrder??'')+'" placeholder="正整数；留空自动排在末尾"><label>配件标识</label><input id="accessoryMark" value="'+esc(x?.accessoryMark||"")+'" placeholder="例如 A12、B3（可留空）"><label>商品大类</label><select id="mainCatSel" onchange="refreshSubSelect()"><option value="">不选择大类</option>';
 categories.forEach(m=>{formHtml+='<option value="'+esc(m.id)+'" '+(m.id===selMainId?"selected":"")+'>'+esc(m.name)+'</option>';});
 formHtml+='</select><label>商品小类</label><select id="subCatSel"><option value="">先选择大类</option></select><label>区域</label><select id="area" onchange="updateShelfOptions()"><option value="">请选择区域</option>';
 [...new Set(locations.map(x=>x.area).filter(Boolean))].forEach(v=>{formHtml+='<option value="'+esc(v)+'" '+(v===a?"selected":"")+'>'+esc(v)+'</option>';});
 formHtml+='</select><label>货架 / 存放位置</label><select id="shelf"></select><button class="primary" style="width:100%;margin-top:16px" onclick="saveItem(\''+(e?esc(x.id):"")+'\')">💾 保存</button>';
 if(e) formHtml+='<button class="danger" style="width:100%;margin-top:9px" onclick="del(\''+esc(x.id)+'\')">🗑 删除商品</button>';
 formHtml+='</div>';
 content(formHtml);
 let shelfEl=document.getElementById("shelf");
 if(shelfEl)shelfEl.dataset.current=s;
 updateShelfOptions();
 setTimeout(()=>{
    document.getElementById("mainCatSel").value=selMainId;
    refreshSubSelect(selSubId);
 },20);
}

// =========修复点：小类下拉按照中文名称拼音排序========
function refreshSubSelect(presetSubId){
    let mainSel=document.getElementById("mainCatSel");
    let subSel=document.getElementById("subCatSel");
    if(!mainSel||!subSel)return;
    let mainId=mainSel.value;
    if(!mainId){
        subSel.innerHTML='<option value="">先选择大类</option>';
        return;
    }
    let mainObj=categories.find(m=>m.id===mainId);
    if(!mainObj||!mainObj.subs.length){
        subSel.innerHTML='<option value="">该大类暂无小类</option>';
        return;
    }
    let html='<option value="">--请选择小类--</option>';
    //复制数组，localeCompare 中文zh‑CN按拼音升序排序
    const sortedSubs = [...mainObj.subs].sort((a,b)=> a.name.localeCompare(b.name,"zh-CN"));
    sortedSubs.forEach(s=>{
        html+='<option value="'+esc(s.id)+'" '+(s.id===presetSubId?"selected":"")+'>'+esc(s.name)+'</option>';
    });
    subSel.innerHTML=html;
}

function updateShelfOptions(){
 let areaEl=document.getElementById("area"),shelfEl=document.getElementById("shelf");
 if(!areaEl||!shelfEl)return;
 let area=areaEl.value,current=shelfEl.dataset.current||"";
 let shelves=[...new Set(locations.filter(q=>q.area===area&&q.shelf).map(q=>q.shelf))].sort((a,b)=>a.localeCompare(b,"zh-CN"));
 let shelfHtml='<option value="">请选择货架 / 存放位置</option>';

 let x={

 };
 if(id){

 }
 save();
 if(displaySortEditingId&&String(displaySortEditingId)===String(x.id)){

function getCatText(item){
    if(!item.mainCatId) return "未分类";
    let m=categories.find(c=>c.id===item.mainCatId);

    if(!item.subCatId) return esc(m.name);
    let s=m.subs.find(su=>su.id===item.subCatId);
    if(!s) return esc(m.name);
    return esc(m.name)+" / "+esc(s.name);
}

async function startScanner(){
  stopScanner();
  let scanHtml='<div class="card scan-compact"><button class="small back" onclick="back()">← 取消扫描</button><div id="videoWrap"><video id="previewVideo" playsinline muted autoplay></video><div class="scan-overlay"><div class="left"></div><div class="right"></div><div class="scan-cutout"></div></div></div><div id="scanStatus" class="status">正在启动后置摄像头…</div></div>';
  content(scanHtml);
  const st=document.getElementById("scanStatus"),videoEl=document.getElementById("previewVideo");
  if(!videoEl)return;
  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});
    videoEl.srcObject=mediaStream; await videoEl.play(); scanning=true; st.textContent="✅ 后置已启动，请对准条码";
    codeReader=new ZXing.BrowserMultiFormatReader();
    codeReader.decodeFromVideoDevice(null,"previewVideo",(result,err)=>{if(!scanning)return;if(result){scanning=false;handleScannedCode(result.text)}},{delayBetweenScanAttempts:220});
  }catch(err){console.error(err);st.textContent="⚠️ 摄像头启动失败，请使用【⌨️ 输入条码】录入";stopScanner()}
}

async function stopScanner(){
 scanning=false;
 if(codeReader){
  try{codeReader.reset();}catch(e){}
  codeReader=null;
 }
 if(mediaStream){
  mediaStream.getTracks().forEach(t=>t.stop());
  mediaStream=null;
 }
}

function doSearch(){

function render(a,r){

        const qtyText=qtyRaw===""?"未填写":esc(qtyRaw);
        return '<div class="item product-row" role="button" tabindex="0" data-item-id="'+esc(x.id)+'" style="cursor:pointer">'+
          '<div class="item-title">'+esc(x.name||"未命名商品")+'</div>'+
          '<div class="meta">'+(x.brand?esc(x.brand):"")+(x.model?' · '+esc(x.model):"")+(x.color?' · '+esc(x.color):"")+
          '<br><span class="location">📍 '+esc(loc(x))+'</span>'+(x.code?'<br>🔢 '+esc(x.code):"")+(x.sku?'<br>SKU：'+esc(x.sku):'')+'<br>是否展示：'+(x.isDisplay?'✅ 是':'否')+'<br>展柜排序：'+esc(x.displayOrder??'未设置')+' · 配件标识：'+esc(x.accessoryMark||'未设置')+          '<br><span style="color:'+qtyColor+';font-weight:700">数量：</span><span style="color:#222">'+qtyText+'</span>'+          '<br><span class="update-time">🕒 最后修改：'+esc(x.updated||"无记录")+'</span></div>'+          '</div>';
    }).join("");
    r.querySelectorAll(".product-row").forEach(row=>{
        const open=()=>openEditById(row.getAttribute("data-item-id"));

 }

function saveReceiptEdit(id){
 const r=receipts.find(x=>String(x.id)===String(id));if(!r)return;
 const val=k=>document.getElementById('editR_'+k).value.trim();
 const date=val('date'),qty=Number(val('qty')),name=val('name'),code=val('code'),sku=val('sku');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime())||new Date(date+'T12:00:00').toISOString().slice(0,10)!==date){alert('请选择有效日期');return}
 if(!name){alert('请输入商品名称');return}
 if(!Number.isSafeInteger(qty)||qty<=0){alert('收货数量必须是大于0的整数');return}
 // 修改收货记录只影响收货数据，不修改商品主档或库存。
 for(const key of ['date','code','sku','name','brand','model','color','note'])r[key]=val(key);
 r.qty=qty;r.mainCatId=document.getElementById('mainCatSel').value;r.subCatId=document.getElementById('subCatSel').value;r.modified=new Date().toISOString();
 save();alert('收货记录已修改并保存');showReceipts(date);
}

function exportReceiptPDF(){

 if(!rows.length){alert('当天没有收货');return}

// ===== 展柜检查：独立于商品库存与收货记录 =====
function displayProducts(){return catalogItems().filter(x=>x.isDisplay).sort((a,b)=>(Number(a.displayOrder)||999999)-(Number(b.displayOrder)||999999)||String(a.name||'').localeCompare(String(b.name||''),'zh-CN'))}
function activeDisplaySession(){return displayData.sessions.find(x=>x.id===displayData.activeId)||null}
function createDisplaySession(){
 const old=activeDisplaySession();
 if(old&&!old.finishedAt&&!confirm('当前还有未结束的盘点。确定开始新一轮吗？旧盘点将保留在历史记录中。'))return;
 if(old&&!old.finishedAt)old.finishedAt=new Date().toISOString();
 const products=displayProducts();if(!products.length){alert('暂无展示商品。请先在商品编辑界面勾选“是否展示”。');return}
 const id=String(Date.now())+'_'+Math.random().toString(36).slice(2,8);
 displayData.sessions.unshift({id,startedAt:new Date().toISOString(),finishedAt:null,results:{},snapshot:products.map(x=>({id:String(x.id),name:x.name,sku:x.sku||'',code:x.code||'',area:x.area||'',shelf:x.shelf||''}))});
 displayData.activeId=id;save();openDisplayCheck();
}
function setDisplayCheck(id,status){const session=activeDisplaySession();if(!session||session.finishedAt)return;session.results[id]={status,time:new Date().toISOString()};save();renderDisplayCheck()}
function finishDisplayCheck(){const session=activeDisplaySession();if(!session)return;const count=displayProducts().filter(x=>!session.results[String(x.id)]).length;if(count&&!confirm('还有 '+count+' 件展示商品未检查。仍然结束本次盘点吗？'))return;session.finishedAt=new Date().toISOString();displayData.activeId=null;save();renderDisplayCheck()}
// 排序草稿只保存在内存；点击保存后才更新商品主档。
let displaySortMode=false,displaySortDraft=null,displaySortQuery='',displaySortMain='',displaySortSub='',displaySortEditingId=null;
function editProductFromDisplaySort(id){
 const item=items.find(x=>String(x.id)===String(id));
 if(!item){alert('商品不存在');return}
 displaySortEditingId=String(id);
 form(item);
}
function returnToDisplaySort(){displaySortEditingId=null;renderDisplaySort()}
function sortedDraftProducts(){
 const byId=new Map(displayProducts().map(x=>[String(x.id),x]));
 return (displaySortDraft||[]).map(id=>byId.get(String(id))).filter(Boolean);
}
function startDisplaySort(){displaySortDraft=displayProducts().map(x=>String(x.id));displaySortQuery='';displaySortMain='';displaySortSub='';displaySortMode=true;renderDisplayCheck()}
function cancelDisplaySort(){displaySortEditingId=null;displaySortMode=false;displaySortDraft=null;displaySortQuery='';displaySortMain='';displaySortSub='';renderDisplayCheck()}
function saveDisplaySort(){
 if(!displaySortDraft)return;
 const products=displayProducts();const valid=new Set(products.map(x=>String(x.id)));
 const order=[...new Set(displaySortDraft.filter(id=>valid.has(String(id))))];
 products.forEach(x=>{if(!order.includes(String(x.id)))order.push(String(x.id))});
 order.forEach((id,i)=>{const p=items.find(x=>String(x.id)===String(id));if(p)p.displayOrder=i+1});
 save();cancelDisplaySort();alert('展柜排序已保存');
}
function displaySortFiltered(){
 const q=displaySortQuery.trim().toLowerCase();
 return sortedDraftProducts().filter(p=>(!displaySortMain||String(p.mainCatId)===displaySortMain)&&(!displaySortSub||String(p.subCatId)===displaySortSub)&&(!q||[p.name,p.sku,p.code,p.accessoryMark,p.brand,p.model,loc(p)].join(' ').toLowerCase().includes(q)));
}
function updateDisplaySortFilter(){
 displaySortQuery=document.getElementById('displaySortSearch')?.value||'';
 displaySortMain=document.getElementById('displaySortMain')?.value||'';
 displaySortSub=document.getElementById('displaySortSub')?.value||'';
 renderDisplaySortRows();
}
function updateDisplaySortMain(){
 displaySortMain=document.getElementById('displaySortMain')?.value||'';displaySortSub='';
 const el=document.getElementById('displaySortSub');
 if(el){const m=categories.find(x=>String(x.id)===displaySortMain);el.innerHTML='<option value="">全部小类</option>'+(m?.subs||[]).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')}
 renderDisplaySortRows();
}
function moveDisplayTo(id,position){
 if(!displaySortDraft)return;
 const n=Number(position);
 if(!Number.isInteger(n)||n<1||n>displaySortDraft.length){alert('请输入 1 至 '+displaySortDraft.length+' 的整数序号');return}
 const from=displaySortDraft.indexOf(String(id));if(from<0)return;
 displaySortDraft.splice(from,1);displaySortDraft.splice(n-1,0,String(id));renderDisplaySortRows();
}
function displaySortDragStart(ev,id){ev.dataTransfer.setData('text/plain',String(id));ev.dataTransfer.effectAllowed='move';ev.currentTarget.classList.add('dragging')}
function displaySortDrop(ev,targetId){
 ev.preventDefault();const id=ev.dataTransfer.getData('text/plain');if(!displaySortDraft)return;
 const from=displaySortDraft.indexOf(String(id)),to=displaySortDraft.indexOf(String(targetId));if(from<0||to<0)return;
 displaySortDraft.splice(from,1);displaySortDraft.splice(to,0,id);renderDisplaySortRows();
}
function renderDisplaySortRows(){
 const el=document.getElementById('displaySortRows');if(!el)return;
 const filtered=displaySortFiltered();
 const pos=new Map(displaySortDraft.map((id,i)=>[String(id),i+1]));
 document.getElementById('displaySortCount').textContent='显示 '+filtered.length+' / '+displaySortDraft.length+' 件 · 序号为全部展示商品的实际位置';
 if(!filtered.length){el.innerHTML='<div class="empty">没有符合条件的展示商品</div>';return}
 el.innerHTML=filtered.map(p=>{
 const id=String(p.id),n=pos.get(id);
 return '<div class="display-row" draggable="true" data-sort-id="'+esc(id)+'"><div class="display-top"><span style="font-size:22px;color:#999;cursor:grab;touch-action:none" aria-hidden="true">⠿</span><span class="display-index">'+n+'</span><div style="flex:1;min-width:0"><b>'+esc(p.name)+'</b> <span class="accessory-mark">'+esc(p.accessoryMark||'未设配件标识')+'</span><div class="meta">SKU：'+esc(p.sku||'-')+(p.code?' · 条码：'+esc(p.code):'')+'<br>📍 '+esc(loc(p))+'</div></div></div><div style="display:flex;align-items:center;gap:8px;margin-top:8px"><label style="margin:0;white-space:nowrap" for="sortTo_'+esc(id)+'">移至序号</label><input id="sortTo_'+esc(id)+'" class="sort-target" type="number" min="1" max="'+displaySortDraft.length+'" value="'+n+'" inputmode="numeric" style="width:90px;padding:9px"><button class="small sort-go" type="button" style="min-height:40px">移动</button></div><button class="small sort-edit-product" type="button" style="width:100%;margin-top:9px;background:#e8f1ff;color:#164d91">✏️ 修改商品资料</button></div>';
 }).join('');
 el.querySelectorAll('[data-sort-id]').forEach(row=>{
  const id=row.dataset.sortId;
  row.addEventListener('dragstart',e=>displaySortDragStart(e,id));
  row.addEventListener('dragend',()=>row.classList.remove('dragging'));
  row.addEventListener('dragover',e=>e.preventDefault());
  row.addEventListener('drop',e=>displaySortDrop(e,id));
  const input=row.querySelector('.sort-target');
  row.querySelector('.sort-go').addEventListener('click',()=>moveDisplayTo(id,input.value));
  row.querySelector('.sort-edit-product').addEventListener('click',()=>editProductFromDisplaySort(id));
  input.addEventListener('keydown',e=>{if(e.key==='Enter')moveDisplayTo(id,input.value)});
 });
}
function renderDisplaySort(){
 const m=categories.find(x=>String(x.id)===displaySortMain);
 let h='<div class="card"><button class="small back" onclick="confirmLeaveDisplaySort()">← 返回检查展柜</button><h2>↕ 调整展柜排序</h2><div class="status">商品资料可直接修改并保存，未提交的排序草稿会保留。搜索和分类仅用于定位商品。输入的目标序号始终是全部展示商品中的位置。拖拽适用于电脑，手机建议使用序号移动。</div>';
 h+='<label>搜索商品</label><input id="displaySortSearch" placeholder="名称 / SKU / 条码 / 配件标识 / 位置" value="'+esc(displaySortQuery)+'" oninput="updateDisplaySortFilter()">';
 h+='<div class="grid"><div><label>商品大类</label><select id="displaySortMain" onchange="updateDisplaySortMain()"><option value="">全部大类</option>'+categories.map(x=>'<option value="'+esc(x.id)+'" '+(String(x.id)===displaySortMain?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div><div><label>商品小类</label><select id="displaySortSub" onchange="updateDisplaySortFilter()"><option value="">全部小类</option>'+(m?.subs||[]).map(x=>'<option value="'+esc(x.id)+'" '+(String(x.id)===displaySortSub?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div></div>';
 h+='<div id="displaySortCount" class="status"></div><div id="displaySortRows"></div><div class="grid" style="position:sticky;bottom:0;background:white;padding:12px 0;z-index:5"><button class="primary" onclick="saveDisplaySort()">💾 保存排序</button><button onclick="cancelDisplaySort()">取消修改</button></div></div>';
 content(h);renderDisplaySortRows();
}
function confirmLeaveDisplaySort(){if(confirm('尚未保存的排序修改将丢失，确定返回吗？'))cancelDisplaySort()}
function openDisplayCheck(){stopScanner();if(displaySortMode&&displaySortDraft){renderDisplaySort();return}renderDisplayCheck()}
function renderDisplayCheck(){
 if(displaySortMode&&displaySortDraft){renderDisplaySort();return}
 const products=displayProducts(),session=activeDisplaySession();
 const checked=products.filter(x=>session?.results[String(x.id)]).length,missing=products.filter(x=>session?.results[String(x.id)]?.status==='no').length;
 let h='<div class="card"><button class="small back" onclick="back()">← 返回</button><h2>🛒 检查展柜</h2><div class="status">只显示已勾选“是否展示”的商品。排序可调整，检查记录独立保存，不修改商品库存。</div>';
 h+='<div class="display-toolbar"><button onclick="startDisplaySort()">↕ 调整排序</button><button onclick="openDisplayHistory()">📋 盘点历史</button></div>';
 if(session)h+='<div class="stat"><span>本轮已检查 '+checked+'/'+products.length+'</span><strong style="color:#c62828">缺货 '+missing+'</strong></div><div class="display-progress"><div style="width:'+(products.length?100*checked/products.length:0)+'%"></div></div><div class="status">开始时间：'+esc(new Date(session.startedAt).toLocaleString())+'</div>';
 else h+='<div class="status">当前没有进行中的盘点，点击“开始新一轮盘点”。</div>';
 h+='<button class="primary" style="width:100%;margin:12px 0" onclick="createDisplaySession()">➕ 开始新一轮盘点</button>';
 if(!products.length)h+='<div class="empty">没有展示商品，请先到“新增商品”或“编辑商品”勾选“是否展示”。</div>';
 products.forEach((p,i)=>{
  const id=String(p.id),r=session?.results[id]?.status;
  h+='<div class="display-row"><div class="display-top"><span class="display-index">'+(i+1)+'</span><div style="flex:1;min-width:0"><b>'+esc(p.name)+'</b> <span class="accessory-mark">'+(p.accessoryMark?esc(p.accessoryMark):'未设配件标识')+'</span><div class="meta">SKU：'+esc(p.sku||'-')+(p.code?' · 条码：'+esc(p.code):'')+'<br>📍 '+esc(loc(p))+'</div></div><span>'+(r==='yes'?'✅':r==='no'?'❌':'○')+'</span></div>';
  h+='<button class="small accessory-edit" data-accessory-id="'+esc(id)+'" type="button">✏️ 修改配件标识</button>';
  if(session)h+='<div class="display-actions"><button style="'+(r==='yes'?'background:#dff4e4;color:#176b34':'')+'" onclick="setDisplayCheck(\''+esc(id)+'\',\'yes\')">✓ 有货</button><button style="'+(r==='no'?'background:#ffe4e4;color:#a31616':'')+'" onclick="setDisplayCheck(\''+esc(id)+'\',\'no\')">✕ 缺货</button></div>';
  h+='</div>';
 });
 if(session)h+='<button class="primary" style="width:100%;margin-top:14px" onclick="finishDisplayCheck()">✓ 结束本轮盘点</button>';
 h+='</div>';content(h);
 document.querySelectorAll('[data-accessory-id]').forEach(el=>el.addEventListener('click',()=>editAccessoryMark(el.dataset.accessoryId)));
}
function editAccessoryMark(id){
 const item=items.find(x=>String(x.id)===String(id));
 if(!item){alert('找不到该商品');return;}
 const value=prompt('修改「'+item.name+'」的配件标识（留空可清除）：',item.accessoryMark||'');
 if(value===null)return;
 item.accessoryMark=value.trim();item.updated=new Date().toLocaleString();save();renderDisplayCheck();
}
function openDisplayHistory(){
 let h='<div class="card"><button class="small back" onclick="openDisplayCheck()">← 返回检查展柜</button><h2>📋 展柜盘点历史</h2>';
 if(!displayData.sessions.length)h+='<div class="empty">暂无盘点记录</div>';
 displayData.sessions.forEach(s=>{
  const values=Object.values(s.results||{}),miss=values.filter(x=>x.status==='no').length;
  h+='<div class="item" style="position:relative"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px"><div style="flex:1;min-width:0"><b>'+esc(new Date(s.startedAt).toLocaleString())+'</b><div class="meta">'+(s.finishedAt?'已结束':'进行中')+' · 已检查 '+values.length+' · 缺货 '+miss+'</div></div><button class="small" type="button" aria-label="更多操作" aria-expanded="false" data-history-more="'+esc(s.id)+'" style="min-width:42px;padding:6px 10px">⋯</button></div><div data-history-menu="'+esc(s.id)+'" hidden style="text-align:right;margin:7px 0"><button class="small danger" type="button" data-history-delete="'+esc(s.id)+'">🗑 删除这条记录</button></div><button class="small" type="button" data-display-session="'+esc(s.id)+'">查看详情</button></div>';
 });
 h+='</div>';content(h);
 document.querySelectorAll('[data-display-session]').forEach(el=>el.onclick=()=>showDisplayHistory(el.dataset.displaySession));
 document.querySelectorAll('[data-history-more]').forEach(el=>el.onclick=()=>{
  const menu=[...document.querySelectorAll('[data-history-menu]')].find(x=>x.dataset.historyMenu===el.dataset.historyMore);
  if(!menu)return;
  const shouldShow=menu.hidden;
  document.querySelectorAll('[data-history-menu]').forEach(x=>x.hidden=true);
  document.querySelectorAll('[data-history-more]').forEach(x=>x.setAttribute('aria-expanded','false'));
  menu.hidden=!shouldShow;el.setAttribute('aria-expanded',String(shouldShow));
 });
 document.querySelectorAll('[data-history-delete]').forEach(el=>el.onclick=()=>deleteDisplayHistory(el.dataset.historyDelete));
}
function deleteDisplayHistory(id){
 const s=displayData.sessions.find(x=>String(x.id)===String(id));
 if(!s){alert('这条盘点记录不存在或已被删除。');openDisplayHistory();return;}
 const when=new Date(s.startedAt).toLocaleString();
 if(!confirm('确定删除 '+when+' 的展柜盘点记录吗？\n\n删除后无法撤销。此操作不会删除商品资料或收货记录。'))return;
 displayData.sessions=displayData.sessions.filter(x=>String(x.id)!==String(id));
 if(String(displayData.activeId)===String(id))displayData.activeId=null;
 save();openDisplayHistory();
}
